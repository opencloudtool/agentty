repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=5120']

  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        description: Format Markdown files.
        entry: mdformat
        language: python
        additional_dependencies:
          - mdformat==0.7.22
          - mdformat-front-matters==2.0.0
          - mdformat-gfm==1.0.0
        args: ['--wrap', '88']
        files: \.(md|markdown)$
      - id: djlint-reformat
        name: djlint reformat
        description: Format HTML files and embedded CSS blocks.
        entry: python -X cpu_count=1 -m djlint --reformat --format-css
        language: python
        additional_dependencies: [djlint==1.36.4]
        files: \.html?$
      - id: rustfmt-fix
        name: rustfmt fix
        description: Format all Rust workspace code with rustfmt before review.
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]
      - id: clippy-fix
        name: clippy fix
        description: Auto-fix clippy lints across Rust targets when a mechanical fix is available.
        entry: cargo clippy --fix --allow-dirty --allow-staged -q --all-targets --all-features -- -D warnings
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        pass_filenames: false
        stages: [manual]
      - id: rustfmt
        name: rustfmt check
        description: Verify all Rust workspace code is already formatted with rustfmt.
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        description: Type-check all Rust workspace targets and features without running tests.
        entry: cargo check -q --locked --all-targets --all-features
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        pass_filenames: false
      - id: cargo-check-ag-harness-benchmark
        name: cargo check ag-harness benchmark
        description: Compile-check the manual ag-harness live benchmark without executing it.
        entry: cargo check -q --locked -p ag-harness --test benchmark
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|crates/ag-harness/(src/.*\.rs|tests/benchmark/.*\.rs))$
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Run strict clippy across all Rust targets and features, failing on warnings.
        entry: cargo clippy -q --locked --all-targets --all-features -- -D warnings
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        pass_filenames: false
      - id: clippy-ag-harness-benchmark
        name: clippy ag-harness benchmark
        description: Lint the manual ag-harness live benchmark without executing it.
        entry: cargo clippy -q --locked -p ag-harness --test benchmark -- -D warnings
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|crates/ag-harness/(src/.*\.rs|tests/benchmark/.*\.rs))$
        pass_filenames: false
      - id: test-workspace
        name: cargo nextest workspace
        description: Run workspace source and public API tests with `cargo-nextest`.
        entry: >-
          cargo nextest run --locked --profile ci --workspace
          -E 'not (package(agentty) and kind(test))'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-forge-src
        name: cargo nextest ag-forge src
        description: Source tests for `crates/ag-forge/src`.
        entry: cargo nextest run --locked --profile ci -p ag-forge --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-git-src
        name: cargo nextest ag-git src
        description: Source tests for `crates/ag-git/src`.
        entry: cargo nextest run --locked --profile ci -p ag-git --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-harness-src
        name: cargo nextest ag-harness src
        description: Source tests for `crates/ag-harness/src`.
        entry: cargo nextest run --locked --profile ci -p ag-harness --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-harness-cli-src
        name: cargo nextest ag-harness-cli src
        description: Source tests for `crates/ag-harness-cli/src`.
        entry: cargo nextest run --locked --profile ci -p ag-harness-cli --bin ag-harness
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-orchestration-src
        name: cargo nextest ag-orchestration src
        description: Source tests for `crates/ag-orchestration/src`.
        entry: cargo nextest run --locked --profile ci -p ag-orchestration --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-protocol-src
        name: cargo nextest ag-protocol src
        description: Source tests for `crates/ag-protocol/src`.
        entry: cargo nextest run --locked --profile ci -p ag-protocol --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-clipboard-src
        name: cargo nextest ag-clipboard src
        description: Source tests for `crates/ag-clipboard/src`.
        entry: cargo nextest run --locked --profile ci -p ag-clipboard --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-agent-src
        name: cargo nextest ag-agent src
        description: Source tests for `crates/ag-agent/src`.
        entry: cargo nextest run --locked --profile ci -p ag-agent --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-session-src
        name: cargo nextest ag-session src
        description: Source tests for `crates/ag-session/src`.
        entry: cargo nextest run --locked --profile ci -p ag-session --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-store-src
        name: cargo nextest ag-store src
        description: Source tests for `crates/ag-store/src`.
        entry: cargo nextest run --locked --profile ci -p ag-store --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-tui-text-src
        name: cargo nextest ag-tui-text src
        description: Source tests for `crates/ag-tui-text/src`.
        entry: cargo nextest run --locked --profile ci -p ag-tui-text --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-agentty-src
        name: cargo nextest agentty src
        description: Source tests for `crates/agentty/src`.
        entry: >-
          cargo nextest run --locked --profile ci -p agentty --lib --bin agentty
          -E 'not (package(agentty) and kind(test))'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-xtask-src
        name: cargo nextest ag-xtask src
        description: Source tests for `crates/ag-xtask/src`.
        entry: cargo nextest run --locked --profile ci -p ag-xtask --bin ag-xtask
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-testty-src
        name: cargo nextest testty src
        description: Source tests for `crates/testty/src`.
        entry: cargo nextest run --locked --profile ci -p testty --lib --bins
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-agentty-e2e
        name: cargo nextest agentty e2e
        description: Agentty integration tests from `crates/agentty/tests`.
        entry: >-
          env TESTTY_GIF_MODE=check cargo nextest run --locked --profile ci -p agentty
          --test showcase --test protocol_compliance_e2e --test e2e
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: coverage
        name: coverage
        description: Verify source and example coverage meets workspace ratchet thresholds and write the CI LCOV report for SonarQube and Codecov.
        entry: >-
          env CARGO_UNSTABLE_BUILD_DIR_NEW_LAYOUT=false CARGO_UNSTABLE_FINE_GRAIN_LOCKING=false
          cargo llvm-cov nextest --workspace --lib --bins --examples --locked --profile ci
          --fail-under-lines 93 --fail-under-functions 91
          --lcov --no-default-ignore-filename-regex
          --ignore-filename-regex '(/rustc/|/(tests|benches)/|/(tests\.rs|[0-9a-zA-Z_-]+[_-]tests?\.rs)$|/target/llvm-cov-target/|/\.cargo/(registry|git)/|/\.rustup/toolchains/)'
          --output-path coverage.lcov
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]
      - id: diff-coverage
        name: diff coverage
        description: Verify every coverable line changed from main is covered by tests.
        entry: >-
          bash -eu -o pipefail -c 'env CARGO_UNSTABLE_BUILD_DIR_NEW_LAYOUT=false
          CARGO_UNSTABLE_FINE_GRAIN_LOCKING=false cargo llvm-cov nextest --workspace
          --lib --bins --examples --locked --profile ci --lcov
          --no-default-ignore-filename-regex --ignore-filename-regex
          "(/rustc/|/(tests|benches)/|/(tests\.rs|[0-9a-zA-Z_-]+[_-]tests?\.rs)$|/target/llvm-cov-target/|/\.cargo/(registry|git)/|/\.rustup/toolchains/)"
          --output-path coverage.lcov && diff-cover coverage.lcov
          --compare-branch=main --fail-under=100 --include-untracked --show-uncovered'
        language: python
        additional_dependencies: [diff-cover==10.5.1]
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: cargo-machete
        name: cargo machete
        description: Check workspace manifests for unused dependencies.
        entry: cargo-machete
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]
      - id: cargo-audit
        name: cargo audit
        description: Audit `Cargo.lock` against the RustSec advisory database.
        entry: cargo audit
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: zola-check
        name: zola check
        description: Verify the Zola docs site builds without broken links.
        entry: zola --root docs/site check
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: check-migrations
        name: check migrations
        description: Verify SQL migration files have unique prefix numbers.
        entry: cargo run -q --locked -p ag-xtask -- check-migrations
        language: system
        types: [sql]
        pass_filenames: false
      - id: validate-prek-config
        name: validate prek config
        description: Validate the `prek` hook catalog whenever `.pre-commit-config.yaml` changes.
        entry: prek validate-config .pre-commit-config.yaml
        language: system
        files: ^\.pre-commit-config\.yaml$
        pass_filenames: false
