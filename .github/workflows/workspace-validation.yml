name: Workspace Validation

on:
  workflow_call:
    inputs:
      cargo-audit:
        description: Run the dependency advisory audit hook.
        required: false
        type: boolean
        default: false
      cargo-machete:
        description: Run the unused dependency check hook.
        required: false
        type: boolean
        default: false
      llvm-tools-preview:
        description: Install the Rust `llvm-tools-preview` component.
        required: false
        type: boolean
        default: false
      workspace-tests:
        description: Run the full workspace source test suite hook.
        required: false
        type: boolean
        default: false
    secrets:
      TRUNK_API_TOKEN:
        description: Trunk organization API token used to upload test results.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Workspace validation
    runs-on: ubuntu-latest
    env:
      TRUNK_API_TOKEN_AVAILABLE: ${{ secrets.TRUNK_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust and `prek`
        uses: $/.github/actions/setup-rust-prek
        with:
          cargo-audit: ${{ inputs['cargo-audit'] && 'true' || 'false' }}
          cargo-machete: ${{ inputs['cargo-machete'] && 'true' || 'false' }}
          llvm-tools-preview: ${{ inputs['llvm-tools-preview'] && 'true' || 'false' }}

      - name: Default validation hooks
        run: prek run --all-files

      - name: Dependency advisory audit
        if: ${{ inputs['cargo-audit'] }}
        run: prek run cargo-audit --all-files --hook-stage manual

      - name: Unused dependency check
        if: ${{ inputs['cargo-machete'] }}
        run: prek run cargo-machete --all-files --hook-stage manual

      - name: Full test suite
        id: workspace-tests
        if: ${{ inputs['workspace-tests'] }}
        run: prek run test-workspace --all-files --hook-stage manual

      - name: Upload workspace test results to Trunk
        if: ${{ !cancelled() && inputs['workspace-tests'] && env.TRUNK_API_TOKEN_AVAILABLE == 'true' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
        with:
          junit-paths: target/nextest/ci/junit.xml
          org-slug: agentty
          previous-step-outcome: ${{ steps.workspace-tests.outcome }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
