name: Postsubmit

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep the active postsubmit run alive when newer pushes arrive.
  cancel-in-progress: false

jobs:
  source-tests:
    name: Source tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    env:
      TRUNK_API_TOKEN_AVAILABLE: ${{ secrets.TRUNK_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - member: ag-agent
            hook: test-ag-agent-src
          - member: ag-clipboard
            hook: test-ag-clipboard-src
          - member: ag-forge
            hook: test-ag-forge-src
          - member: ag-git
            hook: test-ag-git-src
          - member: ag-harness
            hook: test-ag-harness-src
          - member: ag-harness-cli
            hook: test-ag-harness-cli-src
          - member: ag-orchestration
            hook: test-ag-orchestration-src
          - member: ag-protocol
            hook: test-ag-protocol-src
          - member: ag-session
            hook: test-ag-session-src
          - member: ag-store
            hook: test-ag-store-src
          - member: ag-tui-text
            hook: test-ag-tui-text-src
          - member: agentty
            hook: test-agentty-src
          - member: ag-xtask
            hook: test-ag-xtask-src
          - member: testty
            hook: test-testty-src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust and `prek`
        uses: ./.github/actions/setup-rust-prek

      - name: Run source tests
        id: source-tests
        run: prek run ${{ matrix.hook }} --all-files --hook-stage manual

      - name: Upload source test results to Trunk
        if: ${{ !cancelled() && env.TRUNK_API_TOKEN_AVAILABLE == 'true' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
        with:
          junit-paths: target/nextest/ci/junit.xml
          org-slug: agentty
          previous-step-outcome: ${{ steps.source-tests.outcome }}
          token: ${{ secrets.TRUNK_API_TOKEN }}

  validate:
    name: Workspace checks
    uses: ./.github/workflows/workspace-validation.yml
    with:
      cargo-audit: true
      cargo-machete: true

  coverage:
    name: SonarQube and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and publish coverage
        uses: ./.github/actions/run-coverage
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          summarize: "true"

  e2e:
    name: End-to-end feature tests
    uses: ./.github/workflows/e2e.yml
