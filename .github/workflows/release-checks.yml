name: Release Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Release validation
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    uses: $/.github/workflows/workspace-validation.yml
    with:
      llvm-tools-preview: true
      workspace-tests: true

  e2e:
    name: Release E2E
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    uses: $/.github/workflows/e2e.yml
