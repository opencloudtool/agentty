name: Setup Rust Prek Workspace
description: Install the shared Rust and `prek` CI tooling after checkout.

inputs:
  cargo-audit:
    description: Install `cargo-audit` for dependency advisory checks.
    required: false
    default: "false"
  cargo-llvm-cov:
    description: Install `cargo-llvm-cov` for coverage-producing jobs.
    required: false
    default: "false"
  cargo-machete:
    description: Install `cargo-machete` for unused dependency checks.
    required: false
    default: "false"
  llvm-tools-preview:
    description: Install the Rust `llvm-tools-preview` component for coverage-producing jobs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup `uv`
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # This Rust workspace uses `uv` only to install `prek`, so there is no
        # Python dependency manifest that can safely invalidate the `uv` cache.
        enable-cache: "false"

    - name: Install `prek`
      shell: bash
      env:
        UV_TOOL_BIN_DIR: /tmp/agentty-uv-tools/bin
      # Pin `prek`, require wheels so CI does not run package build hooks, and
      # expose the installed executable from a fixed trusted path to workflow
      # steps that run hooks.
      run: |
        mkdir -p "$UV_TOOL_BIN_DIR"
        uv tool install --no-build prek==0.4.14
        echo "/tmp/agentty-uv-tools/bin" >> "$GITHUB_PATH"

    - name: Install pinned Rust nightly toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    - name: Install Rust lint and format components
      shell: bash
      run: rustup component add clippy rustfmt

    - name: Install Rust LLVM tools
      if: ${{ inputs['llvm-tools-preview'] == 'true' }}
      shell: bash
      run: rustup component add llvm-tools-preview

    - name: Install `cargo-llvm-cov`
      if: ${{ inputs['cargo-llvm-cov'] == 'true' }}
      uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
      with:
        tool: cargo-llvm-cov

    - name: Install `cargo-audit`
      if: ${{ inputs['cargo-audit'] == 'true' }}
      uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
      with:
        tool: cargo-audit

    - name: Install `cargo-machete`
      if: ${{ inputs['cargo-machete'] == 'true' }}
      uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
      with:
        tool: cargo-machete

    - name: Install `cargo-nextest`
      uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
      with:
        tool: nextest

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
