[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.15.11"
authors = [
  "Vladimir Minev <minev.dev@gmail.com>",
  "Andrei Agaev <andagaev@gmail.com>",
]
edition = "2024"
license = "Apache-2.0"
description = "Agentty is an ADE (Agentic Development Environment) for structured, controllable AI-assisted software development."
repository = "https://github.com/agentty-xyz/agentty"

[workspace.dependencies]
ag-agent = { path = "crates/ag-agent", version = "0.15.11" }
ag-clipboard = { path = "crates/ag-clipboard", version = "0.15.11" }
ag-forge = { path = "crates/ag-forge", version = "0.15.11" }
ag-git = { path = "crates/ag-git", version = "0.15.11" }
ag-harness = { path = "crates/ag-harness", version = "0.15.11" }
ag-orchestration = { path = "crates/ag-orchestration", version = "0.15.11" }
ag-protocol = { path = "crates/ag-protocol", version = "0.15.11" }
ag-session = { path = "crates/ag-session", version = "0.15.11" }
ag-store = { path = "crates/ag-store", version = "0.15.11" }
ag-tui-text = { path = "crates/ag-tui-text", version = "0.15.11" }
testty = { path = "crates/testty", version = "0.15.11" }
async-trait = "0.1"
agent-client-protocol = "2.0.0"
assert_cmd = "2"
askama = "0.16.0"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
jsonschema = { version = "0.52.0", default-features = false }
libproc = "0.14.11"
mockall = "0.15"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "trace"] }
percent-encoding = "2"
portable-pty = "0.9"
prost = "0.14"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm", "layout-cache", "std", "underline-color"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustc-hash = "2"
rustix = { version = "1.1", features = ["event", "fs", "process"] }
schemars = { version = "1", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tachyonfx = { version = "0.25.0", default-features = false, features = ["std"] }
tempfile = "3.27"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["local-offset", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
wiremock = "0.6.5"
x11rb = "0.14"

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Keep noise low
must_use_candidate = "allow"

# High-signal safety/correctness
unwrap_used = "warn"
expect_used = "warn"
get_unwrap = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
panic = "deny"
exit = "warn"
rc_mutex = "warn"
rc_buffer = "warn"

# Practical cleanup/perf
redundant_clone = "warn"
unused_async = "warn"
unused_peekable = "warn"
debug_assert_with_mut_call = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
